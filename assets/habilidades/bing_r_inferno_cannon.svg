<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0b1020"/>
  <text x="40" y="50" font-family="Arial" font-size="28" fill="#cde" font-weight="bold">R: Inferno Cannon</text>
  <text x="40" y="80" font-family="Arial" font-size="16" fill="#9aa">Unleashes a massive, devastating fiery shot that burns the target over time. 80s Cooldown.</text>
  <!-- Bing -->
  <circle cx="210" cy="260" r="50" fill="#4aa0ff"/>
  <rect x="180" y="305" width="60" height="18" rx="9" fill="#333"/>
  <rect x="235" y="240" width="100" height="35" rx="18" fill="#444"/>
  <!-- Fireball -->
  <ellipse cx="440" cy="260" rx="180" ry="60" fill="#ff4400" opacity="0.9"/>
  <ellipse cx="520" cy="260" rx="120" ry="40" fill="#ffaa00" opacity="0.8"/>
  <polygon points="600,240 650,220 650,300" fill="#ff6600"/>
  <!-- Target enemy -->
  <rect x="620" y="220" width="80" height="80" rx="20" fill="#a33"/>
  <circle cx="660" cy="260" r="35" fill="#c44"/>
  <!-- Flame backdrop -->
  <ellipse cx="150" cy="320" rx="70" ry="30" fill="#ff6600" opacity="0.6"/>
  <text x="560" y="380" font-family="Arial" font-size="12" fill="#fff">Disparo ígneo devastador con DoT</text>
</svg>