<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#0ff"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="#0b1020"/>
  <text x="40" y="50" font-family="Arial" font-size="28" fill="#cde" font-weight="bold">Q: Plasma Blast</text>
  <text x="40" y="80" font-family="Arial" font-size="16" fill="#9aa">Fires an energy projectile. 5s Cooldown.</text>
  <!-- Bing -->
  <circle cx="150" cy="280" r="50" fill="#4aa0ff"/>
  <rect x="120" y="310" width="60" height="20" rx="10" fill="#333"/>
  <!-- Cannon -->
  <rect x="190" y="270" width="120" height="40" rx="20" fill="#555"/>
  <rect x="300" y="260" width="80" height="80" rx="40" fill="#222"/>
  <!-- Projectile -->
  <ellipse cx="380" cy="290" rx="140" ry="30" fill="url(#g1)" opacity="0.9"/>
  <polygon points="520,290 540,260 540,320" fill="#ffaa00"/>
  <!-- Target cactus -->
  <rect x="600" y="240" width="40" height="80" fill="#6dbf6d"/>
  <circle cx="620" cy="240" r="25" fill="#6dbf6d"/>
  <text x="610" y="380" font-family="Arial" font-size="12" fill="#fff">Bing dispara proyectil energético</text>
</svg>