<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0b1020"/>
  <text x="40" y="50" font-family="Arial" font-size="28" fill="#cde" font-weight="bold">Q: Flash Slash</text>
  <text x="40" y="80" font-family="Arial" font-size="16" fill="#9aa">Dashes through enemies. Applies Deep Cut.</text>
  <!-- Kotaro -->
  <polygon points="200,260 240,220 280,260 240,300" fill="#7a3fa0"/>
  <circle cx="240" cy="230" r="30" fill="#a86bff"/>
  <!-- Katana slash -->
  <polygon points="240,260 400,180 420,200 260,280" fill="#aaf"/>
  <polygon points="240,260 400,330 420,310 260,240" fill="#fbb"/>
  <!-- Impact -->
  <polygon points="520,220 560,190 600,240 540,270" fill="#fff" opacity="0.8"/>
  <!-- Target -->
  <ellipse cx="620" cy="240" rx="40" ry="30" fill="#7ff07f"/>
  <text x="610" y="245" font-family="Arial" font-size="18" fill="#000">?</text>
  <text x="560" y="380" font-family="Arial" font-size="12" fill="#fff">Dash con corte profundo</text>
</svg>