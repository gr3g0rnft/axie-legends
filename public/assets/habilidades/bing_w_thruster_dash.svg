<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0b1020"/>
  <text x="40" y="50" font-family="Arial" font-size="28" fill="#cde" font-weight="bold">W: Thruster Dash</text>
  <text x="40" y="80" font-family="Arial" font-size="16" fill="#9aa">Rapidly dashes backward away enemies. 10s Cooldown.</text>
  <!-- Bing dashing -->
  <circle cx="400" cy="200" r="45" fill="#4aa0ff"/>
  <rect x="380" y="235" width="40" height="18" rx="9" fill="#333"/>
  <rect x="430" y="170" width="110" height="35" rx="18" fill="#444"/>
  <!-- Fire trail -->
  <ellipse cx="300" cy="250" rx="100" ry="25" fill="#ff6600" opacity="0.8"/>
  <ellipse cx="250" cy="260" rx="70" ry="18" fill="#ffaa33" opacity="0.7"/>
  <!-- Enemy -->
  <circle cx="150" cy="240" r="35" fill="#888"/>
  <text x="140" y="245" font-family="Arial" font-size="24" fill="#fff">⚔</text>
  <!-- Dust -->
  <ellipse cx="180" cy="280" rx="60" ry="20" fill="#777" opacity="0.5"/>
  <text x="610" y="200" font-family="Arial" font-size="26" fill="#e07">Enemy</text>
  <circle cx="700" cy="250" r="40" fill="#e07"/>
  <text x="560" y="380" font-family="Arial" font-size="12" fill="#fff">Retroceso con propulsores</text>
</svg>